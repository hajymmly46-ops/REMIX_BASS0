
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مدیریت ریمیکس‌باس</title>
<style>
body{background:#090711;color:white;font-family:tahoma;padding:18px}
h1{color:#c084fc;text-align:center}
.box{background:#191526;padding:16px;border-radius:14px;margin:15px 0}
input,textarea,select,button{width:100%;box-sizing:border-box;padding:13px;margin:8px 0;border:0;border-radius:9px;font-family:tahoma}
button{background:#9333ea;color:white;font-weight:bold}
textarea{height:130px}
p{color:#ccc;line-height:2}
</style>
</head>
<body>
<h1>🎵 مدیریت ریمیکس‌باس</h1>
<div class="box">
<h3>افزودن آهنگ جدید</h3>
<input placeholder="نام آهنگ">
<input placeholder="نام خواننده">
<select>
<option>شاد</option>
<option>غمگین</option>
<option>ریمیکس</option>
<option>جدید</option>
<option>پرطرفدار</option>
</select>
<label>انتخاب فایل آهنگ</label>
<input type="file" accept="audio/*">
<label>انتخاب کاور آهنگ</label>
<input type="file" accept="image/*">
<h3>متن ترانه</h3>
<textarea placeholder="متن کامل آهنگ را اینجا بنویسید..."></textarea>
<button>ثبت آهنگ</button>
</div>
<div class="box">
<h3>مدیریت آهنگ‌ها</h3>
<p>ویرایش و حذف آهنگ‌ها در نسخه متصل به سرور فعال خواهد شد.</p>
</div>
<div class="box">
<h3>آمار بازدید و دانلود</h3>
<p>آمار پس از اتصال به سرور نمایش داده می‌شود.</p>
</div>
<div class="box">
<h3>پشتیبان‌گیری</h3>
<p>پس از راه‌اندازی ذخیره‌سازی امن فعال می‌شود.</p>
</div>
<p style="text-align:center">REMIXBASS0 ❤️</p>
</body>
</html>
